---
- name: Rolling restart SimpleProxy
  hosts: simpleproxy
  become: true
  gather_facts: false
  serial: 2
  max_fail_percentage: 0
  tasks:
    - name: Restart SimpleProxy
      ansible.builtin.systemd_service:
        name: simpleproxy
        state: restarted

    - name: Wait for the local listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ simpleproxy_port }}"
        timeout: 30

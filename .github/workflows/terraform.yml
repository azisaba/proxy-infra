name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: "Type APPLY when operation is apply"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_region: ${{ vars.LINODE_REGION }}
  TF_VAR_instance_count: ${{ vars.INSTANCE_COUNT || '10' }}
  TF_VAR_proxy_port: ${{ vars.PROXY_PORT || '25565' }}
  TF_VAR_ssh_allowed_ipv4: ${{ vars.SSH_ALLOWED_IPV4 }}
  TF_VAR_ssh_allowed_ipv6: ${{ vars.SSH_ALLOWED_IPV6 || '[]' }}
  TF_VAR_proxy_allowed_ipv4: ${{ vars.PROXY_ALLOWED_IPV4 || '["0.0.0.0/0"]' }}
  TF_VAR_proxy_allowed_ipv6: ${{ vars.PROXY_ALLOWED_IPV6 || '["::/0"]' }}
  TF_VAR_enable_nodebalancer: ${{ vars.ENABLE_NODEBALANCER || 'false' }}
  TF_VAR_nodebalancer_algorithm: ${{ vars.NODEBALANCER_ALGORITHM || 'leastconn' }}
  TF_VAR_nodebalancer_proxy_protocol: ${{ vars.NODEBALANCER_PROXY_PROTOCOL || 'none' }}
  AWS_REGION: auto
  AWS_DEFAULT_REGION: auto

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  plan:
    needs: check
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'plan') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: terraform-plan
    defaults:
      run:
        working-directory: terraform
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Initialize R2 backend
        run: terraform init -backend-config="bucket=${{ vars.R2_BUCKET_NAME }}"

      - name: Create plan
        run: terraform plan -lock-timeout=5m -out=tfplan

  apply-plan:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'apply' &&
      inputs.confirm_apply == 'APPLY'
    runs-on: ubuntu-latest
    environment: terraform-plan
    defaults:
      run:
        working-directory: terraform
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Initialize R2 backend
        run: terraform init -backend-config="bucket=${{ vars.R2_BUCKET_NAME }}"

      - name: Create candidate apply plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Upload candidate apply plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: terraform/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    needs:
      - check
      - apply-plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Download approved apply plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: terraform

      - name: Initialize R2 backend
        run: terraform init -backend-config="bucket=${{ vars.R2_BUCKET_NAME }}"

      - name: Back up the current remote state in R2
        shell: bash
        run: |
          backup_file="${RUNNER_TEMP}/terraform.tfstate"
          if terraform state pull > "${backup_file}" && test -s "${backup_file}"; then
            aws s3 cp "${backup_file}" \
              "s3://${{ vars.R2_BUCKET_NAME }}/backups/proxy-infra/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfstate" \
              --endpoint-url "${AWS_ENDPOINT_URL_S3}"
          fi

      - name: Apply exactly the approved plan
        run: terraform apply -lock-timeout=5m -auto-approve tfplan

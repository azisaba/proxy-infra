name: Configure SimpleProxy nodes

on:
  push:
    branches:
      - main
    paths:
      - "ansible/group_vars/simpleproxy.yml"
      - "ansible/roles/simpleproxy/**"
      - "ansible/site.yml"
      - ".github/workflows/configure-nodes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simpleproxy-nodes-production
  cancel-in-progress: false

jobs:
  configure:
    runs-on:
      - self-hosted
      - linux
    environment: production
    defaults:
      run:
        working-directory: ansible
    env:
      LINODE_ACCESS_TOKEN: ${{ secrets.LINODE_TOKEN }}
      CLOUDFLARE_ZERO_TRUST_ORGANIZATION: ${{ secrets.CLOUDFLARE_ZERO_TRUST_ORGANIZATION }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out proxy infrastructure
        uses: actions/checkout@v5

      - name: Create the Ansible virtual environment
        run: python3 -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Install Ansible collections
        run: .venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Configure all SimpleProxy nodes
        run: .venv/bin/ansible-playbook site.yml
